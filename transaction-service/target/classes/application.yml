server:
  port: 8084

spring:
  application:
    name: finbridge-transaction-service

  datasource:
    url: jdbc:h2:mem:finbridge_tx
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# Настройки интеграции с другими сервисами
account:
  service:
    url: http://localhost:8083

# ============================================================================
# РАСШИРЕННЫЕ НАСТРОЙКИ МОНИТОРИНГА ДЛЯ PROMETHEUS И GRAFANA
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        # Добавлено: prometheus endpoint для метрик
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      enabled: true
    # Новые endpoints для мониторинга
    metrics:
      enabled: true
    prometheus:
      enabled: true

  # Настройки экспорта метрик в Prometheus
  metrics:
    export:
      prometheus:
        enabled: true
        # Включение описаний метрик
        descriptions: true

    # Теги для идентификации сервиса в Prometheus/Grafana
    tags:
      application: ${spring.application.name}
      service: transaction-service
      environment: development
      team: finbridge

    # Включение JVM и системных метрик
    enable:
      jvm: true
      system: true
      process: true
      tomcat: true
      jdbc: true
      # Специальные метрики для HTTP клиентов (вызовы Account Service)
      http.client: true

    # Настройка гистограмм для HTTP запросов (критично для транзакционного сервиса)
    distribution:
      percentiles-histogram:
        http.server.requests: true
        # Метрики для HTTP клиентских запросов к Account Service
        http.client.requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99,0.999
        # Отдельные percentiles для клиентских запросов
        http.client.requests: 0.5,0.9,0.95,0.99
      # Максимальное время ожидания для метрик
      maximum-expected-value:
        http.server.requests: 30s
        # Для транзакций может потребоваться больше времени
        http.client.requests: 15s

# Информация о приложении (будет видна в /actuator/info)
info:
  app:
    name: FinBridge Transaction Service
    description: Transaction processing and validation service with account integration
    version: 1.0.0
    developer: FinBridge Team
    features:
      - Transaction Creation
      - Balance Validation
      - Transaction Processing (PENDING → COMPLETED)
      - Account Service Integration
      - Transaction History
  integrations:
    account-service: ${account.service.url}
  java:
    version: ${java.version}
  spring:
    boot:
      version: ${spring-boot.version}

springdoc:
  api-docs:
    path: /v3/api-docs        # URL для получения JSON спецификации
  swagger-ui:
    path: /swagger-ui.html    # Интерактивный UI
    operationsSorter: method  # Сортировка операций по методу
    tagsSorter: alpha         # Сортировка групп тегов по алфавиту

logging:
  level:
    com.finbridge: DEBUG
    # Добавлено для отладки мониторинга
    io.micrometer: INFO
    org.springframework.boot.actuator: INFO
    # Логирование HTTP клиентских запросов к Account Service
    org.springframework.web.client: DEBUG
    org.springframework.http.client: DEBUG
  pattern:
    # Улучшенный формат логов с информацией о треде и временем
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
