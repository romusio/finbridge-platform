server:
  port: 8081

spring:
  main:
    allow-circular-references: true

  application:
    name: finbridge-user-service

  datasource:
    url: jdbc:h2:mem:finbridge
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION:86400000}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true

  metrics:
    export:
      prometheus:
        enabled: true
        descriptions: true

    tags:
      application: ${spring.application.name}
      service: user-service
      environment: development
      team: finbridge

    enable:
      jvm: true
      system: true
      process: true
      tomcat: true
      jdbc: true

    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.security.authentications: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99,0.999
      maximum-expected-value:
        http.server.requests: 10s

info:
  app:
    name: FinBridge User Service
    description: User registration, authentication and profile management
    version: 1.0.0
    developer: FinBridge Team
    features:
      - User Registration
      - JWT Authentication
      - Profile Management
      - Security & Authorization
  java:
    version: ${java.version}
  spring:
    boot:
      version: ${spring-boot.version}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.finbridge: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    io.micrometer: INFO
    org.springframework.boot.actuator: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
