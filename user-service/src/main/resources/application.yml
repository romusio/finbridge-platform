server:
  port: 8081

spring:
  main:
    allow-circular-references: true

  application:
    name: finbridge-user-service

  datasource:
    url: jdbc:h2:mem:finbridge
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

jwt:
  secret: myFinBridgeSecretKey12345678901234567890123456789012345678901234567890
  expiration: 86400000

# ============================================================================
# РАСШИРЕННЫЕ НАСТРОЙКИ МОНИТОРИНГА ДЛЯ PROMETHEUS И GRAFANA
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        # Добавлено: prometheus endpoint для метрик
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      enabled: true
    # Новые endpoints для мониторинга
    metrics:
      enabled: true
    prometheus:
      enabled: true

  # Настройки экспорта метрик в Prometheus
  metrics:
    export:
      prometheus:
        enabled: true
        # Включение описаний метрик
        descriptions: true

    # Теги для идентификации сервиса в Prometheus/Grafana
    tags:
      application: ${spring.application.name}
      service: user-service
      environment: development
      team: finbridge

    # Включение JVM и системных метрик
    enable:
      jvm: true
      system: true
      process: true
      tomcat: true
      jdbc: true

    # Настройка гистограмм для HTTP запросов (важно для анализа производительности)
    distribution:
      percentiles-histogram:
        http.server.requests: true
        # Для Spring Security endpoints
        spring.security.authentications: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99,0.999
      # Максимальное время ожидания для метрик
      maximum-expected-value:
        http.server.requests: 10s

# Информация о приложении (будет видна в /actuator/info)
info:
  app:
    name: FinBridge User Service
    description: User registration, authentication and profile management
    version: 1.0.0
    developer: FinBridge Team
    features:
      - User Registration
      - JWT Authentication
      - Profile Management
      - Security & Authorization
  java:
    version: ${java.version}
  spring:
    boot:
      version: ${spring-boot.version}

springdoc:
  api-docs:
    path: /v3/api-docs        # URL для получения JSON спецификации
  swagger-ui:
    path: /swagger-ui.html    # Интерактивный UI
    operationsSorter: method  # Сортировка операций по методу
    tagsSorter: alpha         # Сортировка групп тегов по алфавиту

logging:
  level:
    com.finbridge: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    # Добавлено для отладки мониторинга
    io.micrometer: INFO
    org.springframework.boot.actuator: INFO
  pattern:
    # Улучшенный формат логов с информацией о треде и временем
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
